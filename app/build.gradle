plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.truckspot.europe'
    compileSdk 35
    defaultConfig {
        applicationId 'eu.truckspot.europe.preview'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.12.0-preview'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
