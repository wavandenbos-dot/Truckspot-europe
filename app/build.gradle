plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.truckspot.europe'
    compileSdk 35

    defaultConfig {
        applicationId 'eu.truckspot.europe'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8.0-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
