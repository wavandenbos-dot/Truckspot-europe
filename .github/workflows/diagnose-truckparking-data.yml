name: Diagnose official truckparking data
on:
  push:
    branches: [main]
    paths:
      - docs/TRUCKPARKING_DATA_CHECK.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect official NDW truckparking dataset
        run: |
          set -euo pipefail
          curl --fail --retry 2 --location --max-time 35 'https://opendata.ndw.nu/Truckparking_Parking_Table.xml' --output /tmp/ndw_truckparking.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          p=Path('/tmp/ndw_truckparking.xml')
          root=ET.parse(p).getroot()
          local=lambda tag:tag.rsplit('}',1)[-1]
          print('NDW_BYTES',p.stat().st_size,'ROOT',local(root.tag))
          counts=Counter(local(el.tag) for el in root.iter())
          print('NDW_TAG_COUNTS',counts.most_common(35))
          for el in root.iter():
            if local(el.tag) in ('parkingSite','parkingArea','parkingTable','parkingFacility','parkingRecord'):
              vals=[(local(e.tag), (e.text or '').strip()[:70]) for e in el.iter() if local(e.tag) in ('parkingName','value','latitude','longitude','parkingType','vehicleType','parkingUsage','parkingScenario','parkingAccess','truckParking','parkingNumberOfSpaces')]
              print('PARKING_SAMPLE',local(el.tag),el.attrib,'FIELDS',vals[:35])
          PY
      - name: Check additional public European source endpoints
        run: |
          python3 - <<'PY'
          import urllib.request,re
          urls=[
            'https://restareaseurope.com/rest-areas-europe.geojson',
            'https://transportial.com/en-us/tools/truck-parking',
            'https://opendata.ndw.nu/Truckparking_Parking_Table.xml',
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as r:
                chunk=r.read(3000)
                print('SOURCE',url,'HTTP',r.status,'TYPE',r.headers.get('Content-Type'),'LENGTH',r.headers.get('Content-Length'),'HEAD',chunk[:100])
                if 'transportial.com' in url:
                  print('PAGE_LINKS',re.findall(r'href=["\\\']([^"\\\']+)',chunk.decode('utf-8','ignore'))[:20])
            except Exception as e: print('SOURCE_ERROR',url,type(e).__name__,str(e)[:150])
          PY
      - name: Find openly licensed European parking download links
        run: |
          python3 - <<'PY'
          import re,urllib.request,html,json
          for url in ['https://transportial.com/en-us/tools/truck-parking','https://restareaseurope.com/nl/gegevensbronnen/']:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:s=response.read().decode('utf8','replace')
              print('PAGE',url,'SIZE',len(s))
              for pattern in ['geojson','csv','download','json','rest-areas-europe','truck-parking','api/','truckparking']:
                hits=[m.start() for m in re.finditer(re.escape(pattern),s,re.I)]
                print('CONTEXT',pattern,'COUNT',len(hits),[s[max(0,i-130):i+230].replace('\\n',' ')[:350] for i in hits[-5:]])
              links=re.findall(r'(?:href|src)=["\\\']([^"\\\']+)',s,re.I)
              print('MATCHED_LINKS',[html.unescape(x) for x in links if re.search('download|json|csv|geo|dataset|parking|truck|area',x,re.I)][:80])
            except Exception as e:print('PAGE_ERROR',url,str(e)[:220])
          PY
      - name: Inspect European parking GeoJSON structure and official Greek sample
        run: |
          python3 - <<'PY'
          import urllib.request,json,collections
          for url in ['https://restareaseurope.com/downloads/rest-areas-europe.geojson','https://transportial.com/data/truck-parking/v1/open/gr-nap.json']:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=75) as response:
                content=response.read(35000000)
                print('DATASET_FETCH',url,'HTTP',response.status,'SIZE',len(content))
              o=json.loads(content)
              print('DATASET_TOP_KEYS',list(o)[:15] if isinstance(o,dict) else 'LIST','LENGTH',len(o.get('features',[])) if isinstance(o,dict) else len(o))
              items=o.get('features',[]) if isinstance(o,dict) else o
              for item in items[:4]:print('DATASET_SAMPLE',str(item)[:1300])
              counts=collections.Counter()
              for item in items:
                if isinstance(item,dict):
                  for k,v in (item.get('properties') or item).items():
                    if k in ('type','amenity','category','hgv','truck','overnight','overnight_parking','parking','source','vehicle_type','name'):counts[(k,str(v)[:45])]+=1
              print('DATASET_FIELD_COUNTS',counts.most_common(35))
            except Exception as e:print('DATASET_ERROR',url,type(e).__name__,str(e)[:200])
          PY
      - name: Inspect source types and public national feed paths
        run: |
          python3 - <<'PY'
          import urllib.request,re,json,collections
          def get(url,limit=20000000):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=80) as r:return r.read(limit)
          src=get('https://restareaseurope.com/downloads/rest-areas-europe.geojson')
          d=json.loads(src)
          cat=collections.Counter((x['properties'].get('type'),x['properties'].get('country')) for x in d['features'])
          trucks=[x for x in d['features'] if x['properties'].get('type')=='truck_stop']
          truckparking=[x for x in d['features'] if x['properties'].get('amenities',{}).get('truck_parking')==True]
          print('TRUCK_STOP_TOTAL',len(trucks),'TRUCK_PARKING_AMENITY_TOTAL',len(truckparking),'NL_TRUCKSTOPS',cat[('truck_stop','NL')])
          for x in [i for i in trucks if i['properties'].get('country') in ('NL','DE','BE','PL')][:16]:
            print('TRUCKSTOP_SAMPLE',str(x)[:750])
          print('TRUCKSTOP_KEYS',collections.Counter(k for x in trucks for k in x['properties']).most_common(30))
          print('TRUCKPARK_COUNTRIES',collections.Counter(x['properties'].get('country') for x in truckparking).most_common(32))
          page=get('https://transportial.com/en-us/tools/truck-parking',300000).decode('utf8','replace')
          js=re.search(r'src="([^"]*assets/index-[^"]+\\.js)"',page)
          print('TRANSPORTIAL_JS_MATCH',js.group(1) if js else None)
          if js:
            code=get('https://transportial.com'+js.group(1),15000000).decode('utf8','replace')
            urls=sorted(set(re.findall(r'[^"\\\\]{0,120}/data/truck-parking/[^"\\\\]{0,200}',code)))
            for entry in urls[:30]:print('TRANSPORTIAL_DATA_PATH',entry[:300])
            print('TRANSPORTIAL_DATA_PATHS_COUNT',len(urls))
          gr=json.loads(get('https://transportial.com/data/truck-parking/v1/open/gr-nap.json'))
          print('GREEK_FEED_KEYS',list(gr),'GREEK_ITEMS',len(gr.get('items',[])))
          print('GREEK_SAMPLE',str(gr.get('items',[])[:2])[:2500])
          PY
      - name: Count 24-hour truck-designated sites by country
        run: |
          python3 - <<'PY'
          import urllib.request,json,collections,re
          r=urllib.request.urlopen(urllib.request.Request('https://restareaseurope.com/downloads/rest-areas-europe.geojson',headers={'User-Agent':'Mozilla/5.0'}),timeout=80)
          d=json.load(r)
          allh=collections.Counter()
          match=[]
          for x in d['features']:
            p=x['properties']
            if p.get('amenities',{}).get('truck_parking') is not True:continue
            h=str(p.get('openingHours',''))
            if h:allh[h]+=1
            if re.search(r'(?:^24/7$|Mo-Su\\s*00:00-24:00|24:00-24:00)',h,re.I):
              match.append(x)
          print('OPENING_HOURS_DISTINCT',len(allh),'POPULAR',allh.most_common(20))
          print('24H_TRUCK_PARKING_TOTAL',len(match),'COUNTRIES',collections.Counter(x['properties']['country'] for x in match).most_common(30))
          for x in [i for i in match if i['properties']['country'] == 'NL'][:14]:print('24H_NL_SAMPLE',str(x)[:600])
          PY
      - name: Geocode verified Northern Netherlands truck stops
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,time
          addresses=[
            'Edisonstraat 2, 7825 GS Emmen, Netherlands',
            'Industrieweg 2, 7949 AK Rogat, Netherlands',
            'Ruige Weegbree 2, 8472 BE Wolvega, Netherlands',
            'Grote Voort, 8041 Zwolle, Netherlands',
            'Hengelosestraat 6, Deurningen, Netherlands',
          ]
          for address in addresses:
            url='https://nominatim.openstreetmap.org/search?'+urllib.parse.urlencode({'q':address,'format':'json','limit':2})
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'TruckSpotEurope/0.1 (https://github.com/wavandenbos-dot/Truckspot-europe)'})
              with urllib.request.urlopen(req,timeout=15) as r:a=json.load(r)
              print('GEOCODE',address,[(x.get('lat'),x.get('lon'),x.get('type'),x.get('display_name','')[:140]) for x in a])
            except Exception as e: print('GEOCODE_ERROR',address,str(e)[:130])
            time.sleep(1.3)
          PY
