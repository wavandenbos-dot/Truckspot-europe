name: Diagnose official truckparking data
on:
  push:
    branches: [main]
    paths:
      - docs/TRUCKPARKING_DATA_CHECK.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect official NDW truckparking dataset
        run: |
          set -euo pipefail
          curl --fail --retry 2 --location --max-time 35 'https://opendata.ndw.nu/Truckparking_Parking_Table.xml' --output /tmp/ndw_truckparking.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          p=Path('/tmp/ndw_truckparking.xml')
          root=ET.parse(p).getroot()
          local=lambda tag:tag.rsplit('}',1)[-1]
          print('NDW_BYTES',p.stat().st_size,'ROOT',local(root.tag))
          counts=Counter(local(el.tag) for el in root.iter())
          print('NDW_TAG_COUNTS',counts.most_common(35))
          for el in root.iter():
            if local(el.tag) in ('parkingSite','parkingArea','parkingTable','parkingFacility','parkingRecord'):
              vals=[(local(e.tag), (e.text or '').strip()[:70]) for e in el.iter() if local(e.tag) in ('parkingName','value','latitude','longitude','parkingType','vehicleType','parkingUsage','parkingScenario','parkingAccess','truckParking','parkingNumberOfSpaces')]
              print('PARKING_SAMPLE',local(el.tag),el.attrib,'FIELDS',vals[:35])
          PY
      - name: Check additional public European source endpoints
        run: |
          python3 - <<'PY'
          import urllib.request,re
          urls=[
            'https://restareaseurope.com/rest-areas-europe.geojson',
            'https://transportial.com/en-us/tools/truck-parking',
            'https://opendata.ndw.nu/Truckparking_Parking_Table.xml',
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as r:
                chunk=r.read(3000)
                print('SOURCE',url,'HTTP',r.status,'TYPE',r.headers.get('Content-Type'),'LENGTH',r.headers.get('Content-Length'),'HEAD',chunk[:100])
                if 'transportial.com' in url:
                  print('PAGE_LINKS',re.findall(r'href=["\\\']([^"\\\']+)',chunk.decode('utf-8','ignore'))[:20])
            except Exception as e: print('SOURCE_ERROR',url,type(e).__name__,str(e)[:150])
          PY
      - name: Find openly licensed European parking download links
        run: |
          python3 - <<'PY'
          import re,urllib.request,html,json
          for url in ['https://transportial.com/en-us/tools/truck-parking','https://restareaseurope.com/nl/gegevensbronnen/']:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:s=response.read().decode('utf8','replace')
              print('PAGE',url,'SIZE',len(s))
              for pattern in ['geojson','csv','download','json','rest-areas-europe','truck-parking','api/','truckparking']:
                hits=[m.start() for m in re.finditer(re.escape(pattern),s,re.I)]
                print('CONTEXT',pattern,'COUNT',len(hits),[s[max(0,i-130):i+230].replace('\\n',' ')[:350] for i in hits[-5:]])
              links=re.findall(r'(?:href|src)=["\\\']([^"\\\']+)',s,re.I)
              print('MATCHED_LINKS',[html.unescape(x) for x in links if re.search('download|json|csv|geo|dataset|parking|truck|area',x,re.I)][:80])
            except Exception as e:print('PAGE_ERROR',url,str(e)[:220])
          PY
      - name: Inspect European parking GeoJSON structure and official Greek sample
        run: |
          python3 - <<'PY'
          import urllib.request,json,collections
          for url in ['https://restareaseurope.com/downloads/rest-areas-europe.geojson','https://transportial.com/data/truck-parking/v1/open/gr-nap.json']:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=75) as response:
                content=response.read(35000000)
                print('DATASET_FETCH',url,'HTTP',response.status,'SIZE',len(content))
              o=json.loads(content)
              print('DATASET_TOP_KEYS',list(o)[:15] if isinstance(o,dict) else 'LIST','LENGTH',len(o.get('features',[])) if isinstance(o,dict) else len(o))
              items=o.get('features',[]) if isinstance(o,dict) else o
              for item in items[:4]:print('DATASET_SAMPLE',str(item)[:1300])
              counts=collections.Counter()
              for item in items:
                if isinstance(item,dict):
                  for k,v in (item.get('properties') or item).items():
                    if k in ('type','amenity','category','hgv','truck','overnight','overnight_parking','parking','source','vehicle_type','name'):counts[(k,str(v)[:45])]+=1
              print('DATASET_FIELD_COUNTS',counts.most_common(35))
            except Exception as e:print('DATASET_ERROR',url,type(e).__name__,str(e)[:200])
          PY
