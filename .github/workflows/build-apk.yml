name: Build TruckSpot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Source ophalen
        uses: actions/checkout@v4
      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installeren
        uses: android-actions/setup-android@v3
      - name: Android platform installeren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test-APK bouwen
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: TruckSpot-Europe-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
