name: Build TruckSpot Standalone APK V17-test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4
      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 installeren
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ingebouwde V17-test-kaart en icoon gereedmaken
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/web/vendor app/src/main/res/drawable
          test -s app/src/main/assets/web/index.html
          if [ ! -s app/src/main/assets/web/vendor/leaflet.js ]; then
            curl --fail --location --retry 3 \
              'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js' \
              --output app/src/main/assets/web/vendor/leaflet.js
          fi
          if [ ! -s app/src/main/assets/web/vendor/leaflet.css ]; then
            curl --fail --location --retry 3 \
              'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css' \
              --output app/src/main/assets/web/vendor/leaflet.css
          fi
          if [ ! -s app/src/main/res/drawable/truckspot_branded_icon.png ]; then
            python3 - <<'PY'
          import base64,re
          from pathlib import Path
          s=Path('app/src/main/assets/web/index.html').read_text()
          m=re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)',s)
          assert m, "Logo ontbreekt"
          Path('app/src/main/res/drawable/truckspot_branded_icon.png').write_bytes(base64.b64decode(m.group(1)))
          PY
          fi
          test -s app/src/main/res/drawable/truckspot_branded_icon.png
          grep -q './vendor/leaflet.js' app/src/main/assets/web/index.html
          grep -q 'navigator.geolocation' app/src/main/assets/web/index.html
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/web/index.html').read_text()
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/truckspot-inline.js').write_text('\n'.join(parts))
          PY
          node --check /tmp/truckspot-inline.js
          node --check app/src/main/assets/web/own-parking.js
          node --check app/src/main/assets/web/shared-parking.js
          python3 - <<'PY'
          import json
          p='app/src/main/assets/web/shared-config.json'
          d=json.load(open(p))
          assert d['url'].startswith('https://') and d['publishableKey'].startswith('sb_publishable_'), 'Supabase publishable config invalid'
          print('Supabase public client configuration validated')
          PY
          echo "TruckSpot UI is opgeslagen in de APK; Netlify is niet nodig."
      - name: Europees vrachtwagenparkeerbestand in de APK opnemen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/web/data
          if [ ! -s app/src/main/assets/web/data/truckparkings.json ]; then
            curl --fail --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 90 --location \
              'https://zenodo.org/records/14643147/files/truckParkingLocationsEurope_N13323_v04.csv?download=1' \
              -o /tmp/truckParkingLocationsEurope_N13323_v04.csv
            python3 scripts/build_parking_catalog.py \
              /tmp/truckParkingLocationsEurope_N13323_v04.csv \
              app/src/main/assets/web/data/truckparkings.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/web/data/truckparkings.json
            git commit -m "Snapshot Fraunhofer 2025 European truck parking coordinates (CC BY 4.0)" || true
            git push origin HEAD:main || true
          fi
          python3 - <<'PY'
          import json
          p='app/src/main/assets/web/data/truckparkings.json'
          d=json.load(open(p))
          assert len(d['spots'])>=12000, "Parking data invalid or missing"
          print('TRUCK_PARKING_DATASET:',len(d['spots']),'Europe locations embedded')
          PY
      - name: APK compileren
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: APK als Artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: TruckSpot-Europe-V17-Test-Apart
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Directe download maken
        run: cp app/build/outputs/apk/debug/app-debug.apk TruckSpot-Europe-V17-Test-Apart.apk
      - name: APK publiceren als GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v17-blue-p-and-overnight
          name: TruckSpot Europe V17-test - Standalone Android
          body: |
            TruckSpot V17-test-testapp met UI en logo ingebouwd in de APK.
            De APK opent niet langer de Netlify-website.
            Internet blijft nodig voor OpenStreetMap-kaarten en parkeergegevens.
            GPS werkt na toestemming en is niet gekoppeld aan een tachograaf.
            Gedeelde overnachtingsplekken zijn zichtbaar na goedkeuring en controle van trucktoegang en nachtparkeren.
          prerelease: true
          make_latest: false
          files: TruckSpot-Europe-V17-Test-Apart.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
