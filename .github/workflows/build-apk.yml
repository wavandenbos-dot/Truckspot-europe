name: Build TruckSpot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'app/src/main/assets/**'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Source ophalen
        uses: actions/checkout@v4
      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installeren
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Ingebouwde TruckSpot-app voorbereiden
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          mkdir -p app/src/main/assets/vendor/images
          if [ ! -s app/src/main/assets/vendor/leaflet.js ]; then
            echo "Kaartbibliotheek in APK opnemen waar beschikbaar"
            if curl -fLsS --max-time 30 --retry 2 "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" -o app/src/main/assets/vendor/leaflet.js && \
               curl -fLsS --max-time 30 --retry 2 "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" -o app/src/main/assets/vendor/leaflet.css; then
              for img in marker-icon.png marker-icon-2x.png marker-shadow.png; do
                curl -fLsS --max-time 30 --retry 2 "https://unpkg.com/leaflet@1.9.4/dist/images/$img" -o "app/src/main/assets/vendor/images/$img" || true
              done
              python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', './vendor/leaflet.js')
          s=s.replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', './vendor/leaflet.css')
          p.write_text(s,encoding='utf-8')
          PY
            else
              echo "::warning::Kaartbibliotheek blijft via externe CDN geladen; Netlify wordt niet gebruikt."
              rm -rf app/src/main/assets/vendor
            fi
          fi
      - name: Kaartbibliotheek voor volgende builds bewaren
        shell: bash
        run: |
          git config user.name 'truckspot-build-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets
          if ! git diff --cached --quiet; then
            git commit -m "Bundle Leaflet and standalone TruckSpot UI [skip ci]"
            git push origin HEAD:main
          fi
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Zelfstandige APK bouwen
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: APK artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: TruckSpot-Europe-Android-Standalone
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Directe APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk TruckSpot-Europe.apk
      - name: Nieuwe APK publiceren op GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk
          name: TruckSpot Europe - Zelfstandige Android testversie
          body: |
            Zelfstandige APK: TruckSpot-schermen en logo zijn ingebouwd.
            GPS werkt met Android-locatietoestemming, de kaart vereist internet.
            Parkeerbezetting is nog geen gedeelde realtime informatie.
            Dit is een testversie, niet geschikt als gecertificeerde vrachtwagennavigatie.
          prerelease: true
          make_latest: false
          files: TruckSpot-Europe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
