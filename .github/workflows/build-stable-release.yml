name: Signed TruckSpot Europe + private Beheer APKs
on:
  push:
    branches: [main]
    paths:
      - docs/STABLE_BUILD_REQUEST.md
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versie, bv. 1.0.0 (verhoog bij elke publicatie)"
        required: true
        default: "1.0.9"
        type: string
      version_code:
        description: "Versienummer hoger dan vorige build, bv. 100"
        required: true
        default: "109"
        type: string
permissions:
  contents: write
jobs:
  signed_release:
    runs-on: ubuntu-latest
    env:
      TRUCKSPOT_SIGNING_STORE_PASSWORD: ${{ secrets.TRUCKSPOT_KEYSTORE_PASSWORD }}
      TRUCKSPOT_SIGNING_KEY_ALIAS: ${{ secrets.TRUCKSPOT_KEY_ALIAS }}
      TRUCKSPOT_SIGNING_KEY_PASSWORD: ${{ secrets.TRUCKSPOT_KEY_PASSWORD }}
      TRUCKSPOT_KEYSTORE_B64: ${{ secrets.TRUCKSPOT_KEYSTORE_B64 }}
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4
      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 installeren
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ingebouwde V17-test-kaart en icoon gereedmaken
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/web/vendor app/src/main/res/drawable
          test -s app/src/main/assets/web/index.html
          if [ ! -s app/src/main/assets/web/vendor/leaflet.js ]; then
            curl --fail --location --retry 3 \
              'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js' \
              --output app/src/main/assets/web/vendor/leaflet.js
          fi
          if [ ! -s app/src/main/assets/web/vendor/leaflet.css ]; then
            curl --fail --location --retry 3 \
              'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css' \
              --output app/src/main/assets/web/vendor/leaflet.css
          fi
          test -s app/src/main/res/drawable/truckspot_icon.xml
          test -s app/src/main/res/drawable/truckspot_admin_icon.xml
          grep -q './vendor/leaflet.js' app/src/main/assets/web/index.html
          grep -q 'navigator.geolocation' app/src/main/assets/web/index.html
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/web/index.html').read_text()
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/truckspot-inline.js').write_text('\n'.join(parts))
          PY
          node --check /tmp/truckspot-inline.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/web/admin-only.html').read_text()
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/truckspot-admin-inline.js').write_text('\n'.join(parts))
          PY
          node --check /tmp/truckspot-admin-inline.js
          node --check app/src/main/assets/web/own-parking.js
          node --check app/src/main/assets/web/shared-parking.js
          node --check app/src/main/assets/web/admin-parking.js
          python3 - <<'PY'
          import json
          p='app/src/main/assets/web/shared-config.json'
          d=json.load(open(p))
          assert d['url'].startswith('https://') and d['publishableKey'].startswith('sb_publishable_'), 'Supabase publishable config invalid'
          print('Supabase public client configuration validated')
          PY
          echo "TruckSpot UI is opgeslagen in de APK; Netlify is niet nodig."
      - name: Europees vrachtwagenparkeerbestand in de APK opnemen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/web/data
          if [ ! -s app/src/main/assets/web/data/truckparkings.json ]; then
            curl --fail --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 90 --location \
              'https://zenodo.org/records/14643147/files/truckParkingLocationsEurope_N13323_v04.csv?download=1' \
              -o /tmp/truckParkingLocationsEurope_N13323_v04.csv
            python3 scripts/build_parking_catalog.py \
              /tmp/truckParkingLocationsEurope_N13323_v04.csv \
              app/src/main/assets/web/data/truckparkings.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/web/data/truckparkings.json
            git commit -m "Snapshot Fraunhofer 2025 European truck parking coordinates (CC BY 4.0)" || true
            git push origin HEAD:main || true
          fi
          python3 - <<'PY'
          import json
          p='app/src/main/assets/web/data/truckparkings.json'
          d=json.load(open(p))
          assert len(d['spots'])>=12000, "Parking data invalid or missing"
          print('TRUCK_PARKING_DATASET:',len(d['spots']),'Europe locations embedded')
          PY

      - name: Europese truckparkings en geverifieerde nachtparkings in APK opnemen
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_truckparking_verified_catalog.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('app/src/main/assets/web/data/truckparking-verified.json')
          d=json.loads(path.read_text(encoding='utf8'))
          assert d['count']>=4500 and len(d['spots'])==d['count'], "Onjuiste vrachtwagenparkings"
          assert any(r[4]=='NL' and r[-1]==1 for r in d['spots']), "Nachtparking NL ontbreekt"
          assert any(r[4]=='DE' for r in d['spots']), "Europese parkings ontbreken"
          assert all(r[-1]==0 for r in d['spots'] if str(r[0]).startswith('osm-')), "OSM alleen bewijst nachtparkeren niet"
          print('Verified catalog: %d HGV-designated spots; %d operator-confirmed overnight; %d bytes' % (d['count'],sum(r[-1]==1 for r in d['spots']),path.stat().st_size))
          PY
      - name: APK met vaste pakketnaam en eigen ondertekening voorbereiden
        env:
          VERSION_NAME: ${{ inputs.version_name || '1.0.9' }}
          VERSION_CODE: ${{ inputs.version_code || '109' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in TRUCKSPOT_KEYSTORE_B64 TRUCKSPOT_SIGNING_STORE_PASSWORD TRUCKSPOT_SIGNING_KEY_ALIAS TRUCKSPOT_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Vereiste GitHub secret ontbreekt: $name"
              exit 1
            fi
          done
          echo "Alle vier beveiligde GitHub secrets zijn beschikbaar."
          if ! printf '%s' "$TRUCKSPOT_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/truckspot-stable.jks"; then
            echo "::error::TRUCKSPOT_KEYSTORE_B64 is niet geldige Base64, ook na verwijderen van witruimte. Kopieer opnieuw de volledige inhoud van truckspot-github-secret.txt naar de GitHub secret."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/truckspot-stable.jks"
          if [ ! -s "$RUNNER_TEMP/truckspot-stable.jks" ]; then
            echo "::error::Leeg sleutelbestand in GitHub secret."
            exit 1
          fi
          echo "Sleutelbestand veilig gedecodeerd (geen sleutelinhoud weergegeven)."
          if ! keytool -list -keystore "$RUNNER_TEMP/truckspot-stable.jks" -storepass "$TRUCKSPOT_SIGNING_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Het keystorewachtwoord is onjuist of het JKS-bestand is beschadigd."
            exit 1
          fi
          echo "Keystorewachtwoord is geldig."
          if ! keytool -list -keystore "$RUNNER_TEMP/truckspot-stable.jks" -storepass "$TRUCKSPOT_SIGNING_STORE_PASSWORD" -alias "$TRUCKSPOT_SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::De sleutelalias bestaat niet in de keystore. Controleer TRUCKSPOT_KEY_ALIAS."
            exit 1
          fi
          echo "Ondertekeningsalias is geldig."
          echo "TRUCKSPOT_SIGNING_STORE_FILE=$RUNNER_TEMP/truckspot-stable.jks" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          s=Path('app/build.gradle').read_text()
          code=os.environ["VERSION_CODE"]
          name=os.environ["VERSION_NAME"]
          assert code.isdigit() and 1 <= int(code) <= 2**31-1, "Ongeldige versionCode"
          assert re.fullmatch(r'[0-9]+(?:\.[0-9]+){0,3}', name), "Ongeldige versie"
          s,n=re.subn(r"applicationId\s+'[^']+'", "applicationId 'eu.truckspot.europe.stable'",s,count=1); assert n==1
          s,n=re.subn(r"versionCode\s+[0-9]+",f"versionCode {code}",s,count=1); assert n==1
          s,n=re.subn(r"versionName\s+'[^']+'",f"versionName '{name}'",s,count=1); assert n==1
          s+="""
          android {
              signingConfigs {
                  truckspotStable {
                      storeFile file(System.getenv('TRUCKSPOT_SIGNING_STORE_FILE'))
                      storePassword System.getenv('TRUCKSPOT_SIGNING_STORE_PASSWORD')
                      keyAlias System.getenv('TRUCKSPOT_SIGNING_KEY_ALIAS')
                      keyPassword System.getenv('TRUCKSPOT_SIGNING_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.truckspotStable
                  }
              }
          }
          """
          Path('app/build.gradle').write_text(s)
          label=Path('app/src/main/res/values/strings.xml')
          label.write_text(re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">TruckSpot Europe</string>', label.read_text(), count=1))
          print('Stable Android app-ID, app label and signing configuration injected.')
          PY
      - name: Beheeromgeving buiten de publieke APK houden
        shell: bash
        run: |
          set -euo pipefail
          cp app/src/main/assets/web/admin-only.html "$RUNNER_TEMP/truckspot-admin-only.html"
          cp app/src/main/assets/web/admin-parking.js "$RUNNER_TEMP/truckspot-admin-parking.js"
          rm app/src/main/assets/web/admin-only.html app/src/main/assets/web/admin-parking.js
          test ! -f app/src/main/assets/web/admin-only.html
          test ! -f app/src/main/assets/web/admin-parking.js
      - name: Ondertekende APK compileren
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Handtekening en versie controleren
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "package: name='eu.truckspot.europe.stable'"
          cp "$apk" TruckSpot-Europe-Stable-Signed.apk
      - name: Aparte, beveiligde TruckSpot Beheer APK bouwen
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/truckspot-admin-only.html" app/src/main/assets/web/admin-only.html
          cp "$RUNNER_TEMP/truckspot-admin-parking.js" app/src/main/assets/web/admin-parking.js
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle')
          build = gradle.read_text()
          old = "applicationId 'eu.truckspot.europe.stable'"
          assert build.count(old)==1, 'Unexpected public app ID'
          gradle.write_text(build.replace(old,"applicationId 'eu.truckspot.europe.admin'"))
          manifest = Path('app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          old_icon = 'android:icon="@drawable/truckspot_icon"'
          assert content.count(old_icon)==1
          manifest.write_text(content.replace(old_icon,'android:icon="@drawable/truckspot_admin_icon"'))
          strings = Path('app/src/main/res/values/strings.xml')
          content = strings.read_text()
          assert '<string name="app_name">TruckSpot Europe</string>' in content
          strings.write_text(content.replace('<string name="app_name">TruckSpot Europe</string>',
                                            '<string name="app_name">TruckSpot Beheer</string>'))
          activity = Path('app/src/main/java/eu/truckspot/europe/MainActivity.java')
          content = activity.read_text()
          assert content.count('"/assets/index.html"')==1
          activity.write_text(content.replace('"/assets/index.html"','"/assets/admin-only.html"'))
          print('Admin APK has a distinct app ID, app label, icon and admin-only start page.')
          PY
          gradle --no-daemon :app:clean :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='eu.truckspot.europe.admin'"
          cp "$apk" TruckSpot-Europe-Beheer-Signed.apk
      - name: APK als download publiceren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-v${{ inputs.version_name || '1.0.9' }}
          name: TruckSpot Europe Stable v${{ inputs.version_name || '1.0.9' }}
          body: |
            Dit is de stabiel ondertekende APK. Dit is een nieuwe installatie t.o.v. oude debug-testapps.
            Elke volgende APK uit deze workflow kan deze app bijwerken wanneer dezelfde repository secrets
            en Android app-ID eu.truckspot.europe.stable worden gebruikt met een hogere versionCode.
            Backup van eigen lokale gegevens vereist vóór verwijdering van oude testapps.
            Driver APK heeft geen beheerpagina. Installeer de aparte TruckSpot Beheer APK
            alleen voor de gemachtigde beheerder; aanmelden en server-side moderatorrol blijven vereist.
            Nieuwe chauffeurversies blijven eu.truckspot.europe.stable.
          files: |
            TruckSpot-Europe-Stable-Signed.apk
            TruckSpot-Europe-Beheer-Signed.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
